basePath: /api/v1
definitions:
  user.User:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      name:
        type: string
      updatedAt:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API de exemplo
  title: REST API go
  version: "1.0"
paths:
  /users:
    get:
      description: Retorna a lista de usuários
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/user.User'
            type: array
      summary: Lista todos os usuários
      tags:
      - users
  /users/:ID:
    get:
      description: Retorna o usuário filtrado por ID
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/user.User'
            type: array
      summary: Lista o usuário com o ID desejado
      tags:
      - users
  /users/delete/:ID:
    delete:
      description: Remove o usuário com o determinado id no json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/user.User'
            type: array
      summary: Remover usuário por id
      tags:
      - users
  /users/post/:name:
    post:
      description: Adiciona um novo usuário ao json
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            items:
              $ref: '#/definitions/user.User'
            type: array
      summary: Adicionar um novo usuário
      tags:
      - users
  /users/update/:id/:name:
    patch:
      description: Muda o nome do usuário definido por url, com id e name
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/user.User'
            type: array
      summary: Faz o update do user
      tags:
      - users
swagger: "2.0"
